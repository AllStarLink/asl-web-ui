;
; asl-web-ui settings
;
; See asl-web-ui(8). Restart the service after changing this file:
;     systemctl restart asl-web-ui
;
; Other packages put their settings in /etc/asl-web-ui/conf.d/*.ini, read
; after this file. For example, the ASL3 appliance sets in its own file:
;     [https]
;     apache_vhosts = external
; so that asl-web-ui gives the appliance's Apache sites the Let's Encrypt
; certificate instead of writing a site of its own.
;

[web]
; Allow logging in over plain HTTP. Passwords would cross the network
; unencrypted, so this is strongly discouraged. Set up HTTPS in Apache instead.
allow_insecure_http = no

[logging]
; One of: debug, info, warning, error
level = info
