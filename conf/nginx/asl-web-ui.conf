##
## asl-web-ui: configuration for nginx
##
## nginx has no equivalent of Apache's a2enconf, so this file is not enabled
## automatically. Add this line inside the server { } block of your site
## (for example /etc/nginx/sites-available/default), preferably the HTTPS one:
##
##     include /etc/asl-web-ui/nginx.conf;
##
## then run "nginx -t && systemctl reload nginx". asl-web-ui refuses logins
## over plain HTTP, so make sure the site is reachable with HTTPS.
##

location = /asl-web-ui {
    return 301 $scheme://$http_host/asl-web-ui/;
}

location /asl-web-ui/ {
    alias /usr/share/asl-web-ui/www/;
    index index.html;
    autoindex off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # PatternFly sets some inline style attributes, hence style-src-attr.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}

# The API is served by asl-web-ui.service over a Unix socket.
location /asl-web-ui/api/ {
    proxy_pass http://unix:/run/asl-web-ui/web.sock:/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replace (not append to) anything the client sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

# WebSocket endpoints (live updates and terminals).
location /asl-web-ui/api/v1/ws/ {
    proxy_pass http://unix:/run/asl-web-ui/web.sock:/api/v1/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}
