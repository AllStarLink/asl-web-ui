# asl-web-ui: web management interface for AllStarLink
#
# Enabled by the package with "a2enconf asl-web-ui". The UI is served at
# /asl-web-ui/ on every virtual host. It refuses logins over plain HTTP, so
# make sure the site is reachable with HTTPS. For HTTPS sites, consider adding
# Strict-Transport-Security in your TLS virtual host.

Alias /asl-web-ui /usr/share/asl-web-ui/www

<Directory /usr/share/asl-web-ui/www>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
</Directory>

# The API and its WebSockets (under /api/v1/ws/) are served by
# asl-web-ui.service over a Unix socket. mod_proxy appends the client address
# to any X-Forwarded-For header the client sent; the service uses only the
# last entry.
ProxyPass        /asl-web-ui/api/ "unix:/run/asl-web-ui/web.sock|http://localhost/api/" upgrade=websocket
ProxyPassReverse /asl-web-ui/api/ http://localhost/api/

<Location /asl-web-ui/api/>
    # Tell the service whether the browser used HTTPS. "set" replaces any
    # value sent by the client.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
</Location>

<Location /asl-web-ui/>
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    # PatternFly sets some inline style attributes, hence style-src-attr.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
</Location>
